version: 2

# Grouping is the point of this file. Ungrouped, four ecosystems across two
# lockfiles produce a steady drip of single-package PRs that nobody reviews.
# Grouped, it is one PR per ecosystem per week for routine minor/patch bumps,
# with majors broken out individually because those are the ones that need
# actual reading.
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    groups:
      # Majors are deliberately excluded from the group, so each still arrives
      # as its own PR — those are the ones that need actual reading.
      server-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # `@types/node` describes the runtime, and the runtime is whatever both
      # Dockerfile stages say — currently `node:22-slim`. Types running ahead
      # of the base image is worse than types running behind it: `tsc` accepts
      # an API that only exists in Node 24+, the build is green, and the
      # container throws a TypeError in production. Bump this in the same
      # commit that moves the base image, never on its own.
      #
      # This only holds the root package.json. `web/` keeps floating, because
      # its `@types/node` types Vite's build tooling — which runs on the
      # developer/CI Node, not inside the server image.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

      # TypeScript is capped by the linter, not by us: typescript-eslint peers
      # on `>=4.8.4 <6.1.0`, and 8.67.0 (current latest) still does. A TS 6/7
      # bump therefore cannot even install — `npm ci` dies with ERESOLVE
      # before a single file is compiled, so the PR arrives with every job red
      # and nothing to read.
      #
      # A version range is used rather than `update-types: semver-major`, so
      # that lifting the hold is a one-line delete once typescript-eslint
      # ships a release that peers on the newer major. Check with:
      #   npm view typescript-eslint@latest peerDependencies
      - dependency-name: "typescript"
        versions: [">=6"]

      # js-yaml 5 is a parser rewrite, not a version bump, and this repo runs
      # two copies of it: the server parses `.diffsentry.yaml` for real
      # (`src/repo-config.ts`, `src/api/config.ts`) and the SPA config editor
      # parses the same text to preview what the server is about to do
      # (`web/src/pages/RepoConfig.tsx`). Those two must agree, so the two
      # directories can only move together — which Dependabot cannot express,
      # because it raises one PR per directory. #110/#111 were the first such
      # pair and #138 was the web half arriving again on its own.
      #
      # Three v4/v5 differences are load-bearing for user-authored config:
      #
      #   input                     v4                 v5
      #   "# just a comment"        null (-> defaults) throws "input is empty"
      #   "d: 2001-12-14"           Date               "2001-12-14" (string)
      #   "m: {<<: *base, y: 2}"    merged             literal "<<" key
      #
      # Ship the lift as one PR touching both directories: convert the three
      # default imports (v5 has no default export — that is the MISSING_EXPORT
      # the SPA build dies on), swallow the empty-document throw where v4
      # returned null, and add tests pinning all three rows above. Delete this
      # hold and the matching one in the /web block in that same PR.
      - dependency-name: "js-yaml"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: "/web"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: ["dependencies", "area:spa"]
    groups:
      spa-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # The other half of the js-yaml hold. See the root npm block above for
      # the reasoning and for what lifting it requires; both entries come out
      # in the same PR.
      - dependency-name: "js-yaml"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: ["dependencies", "ci"]
    groups:
      actions:
        patterns: ["*"]

  # Watches the `FROM node:22-slim` / `nginx:alpine` base images in both
  # Dockerfiles — base-image CVEs are the most common way a container that was
  # never edited becomes vulnerable.
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels: ["dependencies", "deployment"]
    # Node cuts a major every six months, but only the EVEN ones ever reach
    # LTS — odd majors go end-of-life in about eight months and never receive
    # a maintenance window, so a base image pinned to one silently stops
    # getting security patches.
    #
    # Dependabot cannot express "even majors only": `ignore.versions` matches
    # version patterns, and parity is not a pattern. An earlier attempt to
    # enumerate the odd ones (`versions: ["25.x", ...]`) did NOT work — those
    # patterns do not match Docker tags of the form `25-slim`, and Dependabot
    # proposed node 25 again within a minute of that rule landing.
    #
    # So all node majors are held instead, and LTS moves are made by hand.
    # `update-types` is matched structurally rather than by string, so unlike
    # the enumeration it actually fires. Patch and minor tag updates still
    # flow normally — this only holds the major.
    #
    # When bumping by hand: go to the next EVEN major, and move both
    # Dockerfile (`node:NN-slim`) and Dockerfile.demo (`node:NN-alpine`).
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
