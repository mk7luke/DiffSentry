version: 2

# Grouping is the point of this file. Ungrouped, four ecosystems across two
# lockfiles produce a steady drip of single-package PRs that nobody reviews.
# Grouped, it is one PR per ecosystem per week for routine minor/patch bumps,
# with majors broken out individually because those are the ones that need
# actual reading.
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    groups:
      # Majors are deliberately excluded from the group, so each still arrives
      # as its own PR — those are the ones that need actual reading.
      server-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: "/web"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: ["dependencies", "area:spa"]
    groups:
      spa-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: ["dependencies", "ci"]
    groups:
      actions:
        patterns: ["*"]

  # Watches the `FROM node:22-slim` / `nginx:alpine` base images in both
  # Dockerfiles — base-image CVEs are the most common way a container that was
  # never edited becomes vulnerable.
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels: ["dependencies", "deployment"]
    # Node cuts a major every six months, but only the EVEN ones ever reach
    # LTS — odd majors go end-of-life in about eight months and never receive
    # a maintenance window, so a base image pinned to one silently stops
    # getting security patches.
    #
    # Dependabot cannot express "even majors only": `ignore.versions` matches
    # version patterns, and parity is not a pattern. An earlier attempt to
    # enumerate the odd ones (`versions: ["25.x", ...]`) did NOT work — those
    # patterns do not match Docker tags of the form `25-slim`, and Dependabot
    # proposed node 25 again within a minute of that rule landing.
    #
    # So all node majors are held instead, and LTS moves are made by hand.
    # `update-types` is matched structurally rather than by string, so unlike
    # the enumeration it actually fires. Patch and minor tag updates still
    # flow normally — this only holds the major.
    #
    # When bumping by hand: go to the next EVEN major, and move both
    # Dockerfile (`node:NN-slim`) and Dockerfile.demo (`node:NN-alpine`).
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
