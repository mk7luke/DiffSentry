name: Secret scan

# DiffSentry handles GitHub App private keys, webhook secrets, and AI provider
# keys, so a leaked credential is the highest-cost mistake this repo can make.
# GitHub's native secret scanning covers known provider patterns on push;
# TruffleHog adds *verification* — it only reports a credential it has
# confirmed is live, which is what makes this safe to run as a blocking gate.
on:
  push:
    branches: ["main"]
  pull_request:
  schedule:
    - cron: "13 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  trufflehog:
    name: TruffleHog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: a secret that was committed and then "removed" in a
          # later commit is still in the pack and still compromised.
          fetch-depth: 0

      - name: Scan for verified secrets
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --results=verified
