name: Secret scan

# DiffSentry handles GitHub App private keys, webhook secrets, and AI provider
# keys, so a leaked credential is the highest-cost mistake this repo can make.
# GitHub's native secret scanning covers known provider patterns on push;
# TruffleHog adds *verification* — it only reports a credential it has
# confirmed is live, which is what makes this safe to run as a blocking gate.
# PR and push coverage comes via ci.yml, which calls this workflow so the scan
# sits inside the aggregate `CI passed` gate and can actually block a merge.
# The schedule stays here: a weekly re-scan catches a credential that was live
# all along but only became detectable as TruffleHog's verifiers improve.
on:
  schedule:
    - cron: "13 5 * * 1"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  trufflehog:
    name: TruffleHog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: a secret that was committed and then "removed" in a
          # later commit is still in the pack and still compromised.
          fetch-depth: 0

      # Pinned to a commit SHA, not `@main`. A mutable branch reference means a
      # third party can change what executes in this workflow — with repo
      # read access and the full git history in the working directory — without
      # anything in this repo changing. Dependabot bumps the pin (it reads the
      # trailing version comment), so pinning costs nothing in maintenance.
      - name: Scan for verified secrets
        uses: trufflesecurity/trufflehog@6f3c981e7b77f235fd2702dd74af25fc4b72bf11 # v3.96.0
        with:
          extra_args: --results=verified
